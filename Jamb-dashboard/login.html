<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAMB UTME - Student Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a237e, #283593);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 450px;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: #1a237e;
            font-size: 2rem;
            margin-bottom: 5px;
        }

        .logo p {
            color: #666;
            font-size: 1rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #1a237e;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: #1a237e;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        .login-btn:hover {
            background: #283593;
        }

        .demo-credentials {
            margin-top: 25px;
            padding: 15px;
            background: #e3f2fd;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .demo-credentials h3 {
            color: #1a237e;
            margin-bottom: 10px;
        }

        .success-message {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>JAMB UTME</h1>
            <p>Student Login Portal</p>
        </div>

        <div class="success-message" id="successMessage">
            ✔ Login successful! Redirecting to subject selection...
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="student@jamb.gov.ng" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="login-btn">Login</button>
        </form>

        <div class="demo-credentials">
            <h3>Demo Credentials:</h3>
            <p><strong>Email:</strong> student@jamb.gov.ng</p>
            <p><strong>Password:</strong> password123</p>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Demo login validation
            if (email === 'student@jamb.gov.ng' && password === 'password123') {
                // Store user data
                const userData = {
                    email: email,
                    fullName: 'Demo Student',
                    loginTime: new Date().toISOString()
                };
                
                localStorage.setItem('current_user', JSON.stringify(userData));
                localStorage.setItem('studentName', 'Demo Student');
                
                // Show success message
                document.getElementById('successMessage').style.display = 'block';
                
                // Redirect to subject selection page after 2 seconds
                setTimeout(() => {
                    window.location.href = 'subject-selection.html';
                }, 2000);
            } else {
                alert('Invalid credentials. Use demo credentials provided.');
            }
        });

        // Auto-fill demo credentials for testing
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('email').value = 'student@jamb.gov.ng';
            document.getElementById('password').value = 'password123';
        });
    </script>
</body>
</html>
