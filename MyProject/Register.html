<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Student Registration Form</title>
<link href="https://fonts.googleapis.com/css2?family=Arial:wght@400;600&display=swap" rel="stylesheet">
<style>
body {
  font-family: 'Arial', sans-serif;
  background: linear-gradient(135deg, #e0eafc, #cfdef3);
  margin: 0;
  padding: 40px;
}
h1 {
  text-align: center;
  color: #34495e;
  margin-bottom: 30px;
  font-weight: 700;
}
form {
  max-width: 800px;
  margin: 0 auto;
  background: #fff;
  padding: 40px;
  border-radius: 12px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.15);
}
.form-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 20px;
}
.form-group {
  display: flex;
  flex-direction: column;
}
label {
  font-weight: 600;
  margin-bottom: 8px;
  color: #2c3e50;
}
input, select {
  padding: 12px 15px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 1em;
  transition: border-color 0.3s, box-shadow 0.3s;
}
input:focus, select:focus {
  outline: none;
  border-color: #2980b9;
  box-shadow: 0 0 8px rgba(41, 128, 185, 0.3);
}
button {
  width: 100%;
  padding: 15px;
  margin-top: 30px;
  background: #2980b9;
  color: #fff;
  border: none;
  border-radius: 10px;
  font-size: 1.2em;
  cursor: pointer;
  transition: background 0.3s, transform 0.2s;
}
button:hover {
  background: #3498db;
  transform: translateY(-2px);
}
@media(max-width: 600px) {
  body {
    padding: 20px;
    background: #f2f2f2;
  }
  form {
    padding: 20px;
  }
}
</style>
</head>
<body>

<h1>Student Registration Form</h1>

<!-- IMPORTANT: updated action to match your Flask route -->
<form action="/register" method="POST">
  <div class="form-grid">

    <div class="form-group">
      <label for="first_name">First Name</label>
      <input type="text" id="first_name" name="first_name" placeholder="Enter first name" required />
    </div>
    <div class="form-group">
      <label for="second_name">Second Name</label>
      <input type="text" id="second_name" name="second_name" placeholder="Enter second name" required />
    </div>
    <div class="form-group">
      <label for="other_name">Other Name</label>
      <input type="text" id="other_name" name="other_name" placeholder="Enter other names" />
    </div>
    <div class="form-group">
      <label for="sex">Sex</label>
      <select id="sex" name="sex" required>
        <option value="">Select sex</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Other">Other</option>
      </select>
    </div>
    <div class="form-group">
      <label for="age">Age</label>
      <input type="number" id="age" name="age" min="3" max="100" placeholder="Enter age" required />
    </div>
    <div class="form-group">
      <label for="class_level">Class/Level</label>
      <input type="text" id="class_level" name="class_level" placeholder="e.g., Grade 7" required />
    </div>
    <div class="form-group">
      <label for="parent_phone">Parent Phone Number</label>
      <input type="tel" id="parent_phone" name="parent_phone" placeholder="e.g., +2348012345678" required />
    </div>
    <div class="form-group">
      <label for="student_id">Student ID</label>
      <input type="text" id="student_id" name="student_id" placeholder="Enter unique ID" required />
    </div>
    <div class="form-group">
      <label for="religion">Religion</label>
      <input type="text" id="religion" name="religion" placeholder="e.g., Christianity" />
    </div>
    <div class="form-group">
      <label for="state">State</label>
      <input type="text" id="state" name="state" placeholder="e.g., Lagos" />
    </div>
    <div class="form-group">
      <label for="country">Country</label>
      <input type="text" id="country" name="country" placeholder="e.g., Nigeria" />
    </div>
    <div class="form-group">
      <label for="date_of_birth">Date of Birth</label>
      <input type="date" id="date_of_birth" name="date_of_birth" required />
    </div>
    <div class="form-group">
      <label for="city_location">City/Location</label>
      <input type="text" id="city_location" name="city_location" placeholder="e.g., Ibadan" />
    </div>
  </div>
  <button type="submit">Register Student</button>
</form>

<footer style="text-align: center; margin-top: 40px;">
  <p>My name: BREATH &copy; 2025</p>
</footer>

</body>
</html>
