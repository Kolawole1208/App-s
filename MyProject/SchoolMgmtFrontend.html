<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School Management System</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background-color: #f5f5f5; }
    h1 { color: #2c3e50; }
    .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    .section { margin-bottom: 30px; }
    label { display: block; margin-top: 10px; }
    input[type="text"], select { width: 100%; padding: 8px; margin-top: 5px; }
    button { margin-top: 10px; padding: 10px 15px; background: #3498db; color: white; border: none; border-radius: 5px; cursor: pointer; }
    button:hover { background: #2980b9; }
    .output { margin-top: 15px; background: #ecf0f1; padding: 10px; border-radius: 5px; }
    .output p { margin: 5px 0; }
  </style>
</head>
<body>
  <div class="container">
    <h1>School Management System</h1>

    <!-- Student Section -->
    <div class="section">
      <h2>Add Student</h2>
      <label for="student_id">Student ID:</label>
      <input type="text" id="student_id">
      <label for="student_name">Student Name:</label>
      <input type="text" id="student_name">
      <button onclick="addStudent()">Add Student</button>
      <div class="output" id="student_output"></div>
    </div>

    <!-- Teacher Section -->
    <div class="section">
      <h2>Add Teacher</h2>
      <label for="teacher_id">Teacher ID:</label>
      <input type="text" id="teacher_id">
      <label for="teacher_name">Teacher Name:</label>
      <input type="text" id="teacher_name">
      <button onclick="addTeacher()">Add Teacher</button>
      <div class="output" id="teacher_output"></div>
    </div>

    <!-- Course Section -->
    <div class="section">
      <h2>Add Course</h2>
      <label for="course_id">Course ID:</label>
      <input type="text" id="course_id">
      <label for="course_name">Course Name:</label>
      <input type="text" id="course_name">
      <label for="course_teacher_id">Teacher ID:</label>
      <input type="text" id="course_teacher_id">
      <button onclick="addCourse()">Add Course</button>
      <div class="output" id="course_output"></div>
    </div>

    <!-- Enroll Section -->
    <div class="section">
      <h2>Enroll Student in Course</h2>
      <label for="enroll_student_id">Student ID:</label>
      <input type="text" id="enroll_student_id">
      <label for="enroll_course_id">Course ID:</label>
      <input type="text" id="enroll_course_id">
      <button onclick="enrollStudent()">Enroll</button>
      <div class="output" id="enroll_output"></div>
    </div>
  </div>

  <script>
    function displayMessage(id, msg) {
      document.getElementById(id).innerHTML = `<p>${msg}</p>`;
    }

    function addStudent() {
      const id = document.getElementById('student_id').value;
      const name = document.getElementById('student_name').value;
      fetch('/add_student', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({student_id: id, name: name})
      }).then(res => res.text())
        .then(data => displayMessage('student_output', data));
    }

    function addTeacher() {
      const id = document.getElementById('teacher_id').value;
      const name = document.getElementById('teacher_name').value;
      fetch('/add_teacher', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({teacher_id: id, name: name})
      }).then(res => res.text())
        .then(data => displayMessage('teacher_output', data));
    }

    function addCourse() {
      const id = document.getElementById('course_id').value;
      const name = document.getElementById('course_name').value;
      const teacherId = document.getElementById('course_teacher_id').value;
      fetch('/add_course', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({course_id: id, course_name: name, teacher_id: teacherId})
      }).then(res => res.text())
        .then(data => displayMessage('course_output', data));
    }

    function enrollStudent() {
      const studentId = document.getElementById('enroll_student_id').value;
      const courseId = document.getElementById('enroll_course_id').value;
      fetch('/enroll_student', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({student_id: studentId, course_id: courseId})
      }).then(res => res.text())
        .then(data => displayMessage('enroll_output', data));
    }
  </script>

  <footer>
    <p>My name: BREATH @2025</p>
  </footer>

</body>
</html>
