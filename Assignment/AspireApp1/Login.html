<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ilesa University Registration Form</title>
<style>
  body {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    background-color: #f5f8fa;
    margin: 0;
    padding: 0;
  }
  .container {
    max-width: 550px;
    margin: 50px auto;
    padding: 30px;
    border-radius: 10px;
    background-color: #ffffff;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    border: 2px solid #4CAF50;
  }
  h2 {
    text-align: center;
    margin-bottom: 20px;
    color: #4CAF50;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }
  label {
    display: block;
    margin-top: 15px;
    font-weight: 600;
    color: #333;
  }
  input[type="text"], input[type="number"] {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 4px;
    transition: border-color 0.3s;
  }
  input[type="text"]:focus, input[type="number"]:focus {
    border-color: #4CAF50;
    outline: none;
  }
  h3 {
    margin-top: 20px;
    color: #4CAF50;
    font-size: 1.1em;
  }
  .buttons {
    margin-top: 25px;
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
  }
  button {
    background-color: #4CAF50;
    color: #fff;
    padding: 12px 24px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 1em;
    transition: background-color 0.3s;
  }
  button:hover {
    background-color: #45a049;
  }
  /* Additional style for 'Forgot Password' */
  .forgot-btn {
    margin-top: 15px;
    width: 100%;
    background-color: #ff5722;
  }
  .forgot-btn:hover {
    background-color: #e64a19;
  }
  p {
    text-align: center;
    margin-top: 25px;
    font-style: italic;
    color: #555;
  }
</style>
</head>
<body>

<div class="container">
  <h2>Ilesa University Registration Form</h2>
  <form>
    <label for="fname">First Name</label>
    <input type="text" id="fname" name="fname" />

    <label for="lname">Second Name</label>
    <input type="text" id="lname" name="lname" />

    <label for="othername">Other Name</label>
    <input type="text" id="othername" name="othername" />

    <label for="sex">Sex</label>
    <input type="text" id="sex" name="sex" />

    <label for="age">Age</label>
    <input type="number" id="age" name="age" />

    <label for="dob">DOB</label>
    <input type="text" id="dob" name="dob" />

    <h3>Religion</h3>
    <input type="text" id="religion" name="religion" />

    <h3>State</h3>
    <input type="text" id="state" name="state" />

    <h3>Country</h3>
    <input type="text" id="country" name="country" />

    <div class="buttons">
      <button type="submit">Submit</button>
      <button type="button">Sign</button>
      <button type="button">Help</button>
    </div>
    <button type="button" class="forgot-btn">Forgot Password</button>
  </form>
  <p>Designed By: Samuel.</p>
</div>

</body>
</html>
