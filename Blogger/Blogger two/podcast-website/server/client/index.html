<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PodcastHub - Listen, Learn, Inspire</title>
    <meta name="description" content="Discover amazing podcasts on technology, business, entertainment and more." />
    <!-- Bootstrap CSS for styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding-top: 20px; }
        .podcast-card { margin-bottom: 20px; }
        .navbar { margin-bottom: 30px; }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Podcast Website</a>
            <div class="navbar-nav">
                <a class="nav-link" href="#" id="homeLink">Home</a>
                <a class="nav-link" href="#" id="loginLink">Login</a>
                <a class="nav-link" href="#" id="registerLink">Register</a>
                <a class="nav-link" href="#" id="profileLink" style="display:none;">Profile</a>
                <a class="nav-link" href="#" id="logoutLink" style="display:none;">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div id="homePage">
            <h1>Welcome to Podcast Website</h1>
            <div id="podcastsList"></div>
        </div>

        <div id="loginPage" style="display:none;">
            <h2>Login</h2>
            <form id="loginForm">
                <div class="mb-3">
                    <label for="loginEmail" class="form-label">Email</label>
                    <input type="email" class="form-control" id="loginEmail" required>
                </div>
                <div class="mb-3">
                    <label for="loginPassword" class="form-label">Password</label>
                    <input type="password" class="form-control" id="loginPassword" required>
                </div>
                <button type="submit" class="btn btn-primary">Login</button>
            </form>
        </div>

        <div id="registerPage" style="display:none;">
            <h2>Register</h2>
            <form id="registerForm">
                <div class="mb-3">
                    <label for="registerUsername" class="form-label">Username</label>
                    <input type="text" class="form-control" id="registerUsername" required>
                </div>
                <div class="mb-3">
                    <label for="registerEmail" class="form-label">Email</label>
                    <input type="email" class="form-control" id="registerEmail" required>
                </div>
                <div class="mb-3">
                    <label for="registerPassword" class="form-label">Password</label>
                    <input type="password" class="form-control" id="registerPassword" required>
                </div>
                <button type="submit" class="btn btn-primary">Register</button>
            </form>
        </div>

        <div id="profilePage" style="display:none;">
            <h2>Profile</h2>
            <div id="profileInfo"></div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Your custom JavaScript -->
    <script src="app.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
