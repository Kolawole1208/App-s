<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Management System</title>
    <style>
        :root {
            --primary: #3498db;
            --secondary: #2c3e50;
            --success: #2ecc71;
            --danger: #e74c3c;
            --warning: #f39c12;
            --light: #ecf0f1;
            --dark: #34495e;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #f5f7fa;
            color: var(--dark);
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            background-color: var(--secondary);
            color: white;
            padding: 15px 0;
            margin-bottom: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            font-size: 24px;
            font-weight: bold;
        }
        
        .nav-tabs {
            display: flex;
            background-color: var(--light);
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        
        .tab {
            padding: 12px 20px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            flex: 1;
        }
        
        .tab.active {
            background-color: var(--primary);
            color: white;
        }
        
        .tab:hover:not(.active) {
            background-color: #d6dbdf;
        }
        
        .tab-content {
            display: none;
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .tab-content.active {
            display: block;
        }
        
        .grid-container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }
        
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            max-height: 500px;
            overflow-y: auto;
            padding: 10px;
        }
        
        .product-card {
            background-color: white;
            border-radius: 5px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: transform 0.3s;
            cursor: pointer;
            text-align: center;
        }
        
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .product-image {
            width: 100%;
            height: 120px;
            background-color: var(--light);
            border-radius: 5px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #7f8c8d;
        }
        
        .product-name {
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .product-price {
            color: var(--primary);
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .cart-container {
            background-color: white;
            border-radius: 5px;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--light);
        }
        
        .cart-items {
            max-height: 300px;
            overflow-y: auto;
            margin-bottom: 15px;
        }
        
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--light);
        }
        
        .item-details {
            flex: 1;
        }
        
        .item-name {
            font-weight: bold;
        }
        
        .item-price {
            color: var(--primary);
        }
        
        .quantity-controls {
            display: flex;
            align-items: center;
        }
        
        .quantity-btn {
            width: 25px;
            height: 25px;
            background-color: var(--light);
            border: none;
            border-radius: 3px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .quantity {
            margin: 0 10px;
        }
        
        .remove-btn {
            background-color: var(--danger);
            color: white;
            border: none;
            border-radius: 3px;
            padding: 5px 10px;
            cursor: pointer;
            margin-left: 10px;
        }
        
        .cart-total {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 18px;
            padding: 15px 0;
            border-top: 1px solid var(--light);
        }
        
        .checkout-btn {
            width: 100%;
            padding: 12px;
            background-color: var(--success);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .checkout-btn:hover {
            background-color: #27ae60;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        
        .btn {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }
        
        .btn-primary {
            background-color: var(--primary);
            color: white;
        }
        
        .btn-primary:hover {
            background-color: #2980b9;
        }
        
        .btn-danger {
            background-color: var(--danger);
            color: white;
        }
        
        .btn-danger:hover {
            background-color: #c0392b;
        }
        
        .table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        
        .table th, .table td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        
        .table th {
            background-color: var(--light);
        }
        
        .table tr:hover {
            background-color: #f9f9f9;
        }
        
        .action-btns {
            display: flex;
            gap: 5px;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .modal-content {
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            width: 400px;
            max-width: 90%;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--light);
        }
        
        .close-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
        }
        
        .receipt {
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            max-width: 400px;
            margin: 0 auto;
        }
        
        .receipt-header {
            text-align: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px dashed #ddd;
        }
        
        .receipt-items {
            margin-bottom: 15px;
        }
        
        .receipt-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        
        .receipt-total {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            padding-top: 10px;
            border-top: 1px dashed #ddd;
        }
        
        @media (max-width: 768px) {
            .grid-container {
                grid-template-columns: 1fr;
            }
            
            .products-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content">
                <div class="logo">POS Management System</div>
                <div id="current-time"></div>
            </div>
        </div>
    </header>
    
    <div class="container">
        <div class="nav-tabs">
            <div class="tab active" data-tab="pos">Point of Sale</div>
            <div class="tab" data-tab="products">Product Management</div>
            <div class="tab" data-tab="transactions">Transaction History</div>
        </div>
        
        <!-- POS Tab -->
        <div id="pos" class="tab-content active">
            <div class="grid-container">
                <div class="products-section">
                    <h2>Products</h2>
                    <div class="products-grid" id="products-grid">
                        <!-- Products will be dynamically added here -->
                    </div>
                </div>
                
                <div class="cart-container">
                    <div class="cart-header">
                        <h2>Current Sale</h2>
                        <button class="btn btn-danger" id="clear-cart">Clear Cart</button>
                    </div>
                    
                    <div class="cart-items" id="cart-items">
                        <!-- Cart items will be dynamically added here -->
                    </div>
                    
                    <div class="cart-total">
                        <span>Total:</span>
                        <span id="cart-total">$0.00</span>
                    </div>
                    
                    <button class="checkout-btn" id="checkout-btn">Checkout</button>
                </div>
            </div>
        </div>
        
        <!-- Product Management Tab -->
        <div id="products" class="tab-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2>Product Management</h2>
                <button class="btn btn-primary" id="add-product-btn">Add New Product</button>
            </div>
            
            <table class="table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Category</th>
                        <th>Price</th>
                        <th>Stock</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="products-table">
                    <!-- Products will be dynamically added here -->
                </tbody>
            </table>
        </div>
        
        <!-- Transaction History Tab -->
        <div id="transactions" class="tab-content">
            <h2>Transaction History</h2>
            
            <table class="table">
                <thead>
                    <tr>
                        <th>Transaction ID</th>
                        <th>Date</th>
                        <th>Items</th>
                        <th>Total Amount</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="transactions-table">
                    <!-- Transactions will be dynamically added here -->
                </tbody>
            </table>
        </div>
    </div>
    
    <!-- Product Modal -->
    <div id="product-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="product-modal-title">Add Product</h3>
                <button class="close-btn">&times;</button>
            </div>
            <form id="product-form">
                <input type="hidden" id="product-id">
                <div class="form-group">
                    <label for="product-name">Product Name</label>
                    <input type="text" id="product-name" required>
                </div>
                <div class="form-group">
                    <label for="product-category">Category</label>
                    <select id="product-category" required>
                        <option value="">Select Category</option>
                        <option value="Electronics">Electronics</option>
                        <option value="Clothing">Clothing</option>
                        <option value="Food">Food</option>
                        <option value="Books">Books</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="product-price">Price ($)</label>
                    <input type="number" id="product-price" min="0" step="0.01" required>
                </div>
                <div class="form-group">
                    <label for="product-stock">Stock</label>
                    <input type="number" id="product-stock" min="0" required>
                </div>
                <div class="form-group">
                    <button type="submit" class="btn btn-primary">Save Product</button>
                </div>
            </form>
        </div>
    </div>
    
    <!-- Receipt Modal -->
    <div id="receipt-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Sale Receipt</h3>
                <button class="close-btn">&times;</button>
            </div>
            <div class="receipt" id="receipt-content">
                <!-- Receipt content will be dynamically added here -->
            </div>
            <div style="text-align: center; margin-top: 15px;">
                <button class="btn btn-primary" id="print-receipt">Print Receipt</button>
                <button class="btn" id="close-receipt">Close</button>
            </div>
        </div>
    </div>

    <script>
        // Sample initial data
        let products = [
            { id: 1, name: "Laptop", category: "Electronics", price: 999.99, stock: 10 },
            { id: 2, name: "T-Shirt", category: "Clothing", price: 19.99, stock: 50 },
            { id: 3, name: "Coffee", category: "Food", price: 4.99, stock: 100 },
            { id: 4, name: "Book", category: "Books", price: 14.99, stock: 30 },
            { id: 5, name: "Headphones", category: "Electronics", price: 79.99, stock: 25 },
            { id: 6, name: "Jeans", category: "Clothing", price: 49.99, stock: 40 }
        ];
        
        let cart = [];
        let transactions = [];
        let nextProductId = 7;
        let nextTransactionId = 1;
        
        // DOM Elements
        const productsGrid = document.getElementById('products-grid');
        const cartItems = document.getElementById('cart-items');
        const cartTotal = document.getElementById('cart-total');
        const productsTable = document.getElementById('products-table');
        const transactionsTable = document.getElementById('transactions-table');
        const tabs = document.querySelectorAll('.tab');
        const tabContents = document.querySelectorAll('.tab-content');
        const productModal = document.getElementById('product-modal');
        const receiptModal = document.getElementById('receipt-modal');
        const productForm = document.getElementById('product-form');
        const addProductBtn = document.getElementById('add-product-btn');
        const clearCartBtn = document.getElementById('clear-cart');
        const checkoutBtn = document.getElementById('checkout-btn');
        const closeButtons = document.querySelectorAll('.close-btn');
        const printReceiptBtn = document.getElementById('print-receipt');
        const closeReceiptBtn = document.getElementById('close-receipt');
        const currentTimeElement = document.getElementById('current-time');
        
        // Initialize the application
        function init() {
            renderProducts();
            renderCart();
            renderProductsTable();
            renderTransactionsTable();
            updateCurrentTime();
            
            // Set up event listeners
            setupEventListeners();
        }
        
        // Set up all event listeners
        function setupEventListeners() {
            // Tab switching
            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    const tabId = tab.getAttribute('data-tab');
                    switchTab(tabId);
                });
            });
            
            // Product modal
            addProductBtn.addEventListener('click', () => openProductModal());
            closeButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    productModal.style.display = 'none';
                    receiptModal.style.display = 'none';
                });
            });
            
            // Product form submission
            productForm.addEventListener('submit', handleProductFormSubmit);
            
            // Cart actions
            clearCartBtn.addEventListener('click', clearCart);
            checkoutBtn.addEventListener('click', checkout);
            
            // Receipt actions
            printReceiptBtn.addEventListener('click', printReceipt);
            closeReceiptBtn.addEventListener('click', () => {
                receiptModal.style.display = 'none';
            });
            
            // Close modals when clicking outside
            window.addEventListener('click', (e) => {
                if (e.target === productModal) {
                    productModal.style.display = 'none';
                }
                if (e.target === receiptModal) {
                    receiptModal.style.display = 'none';
                }
            });
        }
        
        // Switch between tabs
        function switchTab(tabId) {
            tabs.forEach(tab => {
                if (tab.getAttribute('data-tab') === tabId) {
                    tab.classList.add('active');
                } else {
                    tab.classList.remove('active');
                }
            });
            
            tabContents.forEach(content => {
                if (content.id === tabId) {
                    content.classList.add('active');
                } else {
                    content.classList.remove('active');
                }
            });
        }
        
        // Render products in the POS view
        function renderProducts() {
            productsGrid.innerHTML = '';
            
            products.forEach(product => {
                if (product.stock > 0) {
                    const productCard = document.createElement('div');
                    productCard.className = 'product-card';
                    productCard.innerHTML = `
                        <div class="product-image">${product.name.charAt(0)}</div>
                        <div class="product-name">${product.name}</div>
                        <div class="product-price">$${product.price.toFixed(2)}</div>
                        <div class="product-stock">Stock: ${product.stock}</div>
                    `;
                    productCard.addEventListener('click', () => addToCart(product.id));
                    productsGrid.appendChild(productCard);
                }
            });
        }
        
        // Render products in the management table
        function renderProductsTable() {
            productsTable.innerHTML = '';
            
            products.forEach(product => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${product.id}</td>
                    <td>${product.name}</td>
                    <td>${product.category}</td>
                    <td>$${product.price.toFixed(2)}</td>
                    <td>${product.stock}</td>
                    <td class="action-btns">
                        <button class="btn btn-primary edit-product" data-id="${product.id}">Edit</button>
                        <button class="btn btn-danger delete-product" data-id="${product.id}">Delete</button>
                    </td>
                `;
                productsTable.appendChild(row);
            });
            
            // Add event listeners to edit and delete buttons
            document.querySelectorAll('.edit-product').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const productId = parseInt(e.target.getAttribute('data-id'));
                    openProductModal(productId);
                });
            });
            
            document.querySelectorAll('.delete-product').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const productId = parseInt(e.target.getAttribute('data-id'));
                    deleteProduct(productId);
                });
            });
        }
        
        // Render cart items
        function renderCart() {
            cartItems.innerHTML = '';
            
            if (cart.length === 0) {
                cartItems.innerHTML = '<p style="text-align: center; color: #7f8c8d;">Cart is empty</p>';
                cartTotal.textContent = '$0.00';
                return;
            }
            
            let total = 0;
            
            cart.forEach(item => {
                const product = products.find(p => p.id === item.productId);
                const subtotal = product.price * item.quantity;
                total += subtotal;
                
                const cartItem = document.createElement('div');
                cartItem.className = 'cart-item';
                cartItem.innerHTML = `
                    <div class="item-details">
                        <div class="item-name">${product.name}</div>
                        <div class="item-price">$${product.price.toFixed(2)}</div>
                    </div>
                    <div class="quantity-controls">
                        <button class="quantity-btn decrease" data-id="${product.id}">-</button>
                        <span class="quantity">${item.quantity}</span>
                        <button class="quantity-btn increase" data-id="${product.id}">+</button>
                        <button class="remove-btn" data-id="${product.id}">Remove</button>
                    </div>
                `;
                cartItems.appendChild(cartItem);
            });
            
            cartTotal.textContent = `$${total.toFixed(2)}`;
            
            // Add event listeners to cart controls
            document.querySelectorAll('.increase').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const productId = parseInt(e.target.getAttribute('data-id'));
                    increaseQuantity(productId);
                });
            });
            
            document.querySelectorAll('.decrease').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const productId = parseInt(e.target.getAttribute('data-id'));
                    decreaseQuantity(productId);
                });
            });
            
            document.querySelectorAll('.remove-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const productId = parseInt(e.target.getAttribute('data-id'));
                    removeFromCart(productId);
                });
            });
        }
        
        // Render transactions table
        function renderTransactionsTable() {
            transactionsTable.innerHTML = '';
            
            if (transactions.length === 0) {
                transactionsTable.innerHTML = `
                    <tr>
                        <td colspan="5" style="text-align: center; color: #7f8c8d;">No transactions yet</td>
                    </tr>
                `;
                return;
            }
            
            transactions.forEach(transaction => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${transaction.id}</td>
                    <td>${new Date(transaction.date).toLocaleString()}</td>
                    <td>${transaction.items.length} items</td>
                    <td>$${transaction.total.toFixed(2)}</td>
                    <td class="action-btns">
                        <button class="btn btn-primary view-receipt" data-id="${transaction.id}">View Receipt</button>
                    </td>
                `;
                transactionsTable.appendChild(row);
            });
            
            // Add event listeners to view receipt buttons
            document.querySelectorAll('.view-receipt').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const transactionId = parseInt(e.target.getAttribute('data-id'));
                    viewReceipt(transactionId);
                });
            });
        }
        
        // Cart functions
        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            
            if (!product || product.stock === 0) {
                alert('Product is out of stock!');
                return;
            }
            
            const existingItem = cart.find(item => item.productId === productId);
            
            if (existingItem) {
                if (existingItem.quantity < product.stock) {
                    existingItem.quantity++;
                } else {
                    alert('Not enough stock available!');
                }
            } else {
                cart.push({
                    productId: productId,
                    quantity: 1
                });
            }
            
            renderCart();
        }
        
        function increaseQuantity(productId) {
            const cartItem = cart.find(item => item.productId === productId);
            const product = products.find(p => p.id === productId);
            
            if (cartItem && product) {
                if (cartItem.quantity < product.stock) {
                    cartItem.quantity++;
                    renderCart();
                } else {
                    alert('Not enough stock available!');
                }
            }
        }
        
        function decreaseQuantity(productId) {
            const cartItem = cart.find(item => item.productId === productId);
            
            if (cartItem) {
                if (cartItem.quantity > 1) {
                    cartItem.quantity--;
                } else {
                    removeFromCart(productId);
                }
                renderCart();
            }
        }
        
        function removeFromCart(productId) {
            cart = cart.filter(item => item.productId !== productId);
            renderCart();
        }
        
        function clearCart() {
            if (cart.length === 0) {
                alert('Cart is already empty!');
                return;
            }
            
            if (confirm('Are you sure you want to clear the cart?')) {
                cart = [];
                renderCart();
            }
        }
        
        // Checkout function
        function checkout() {
            if (cart.length === 0) {
                alert('Cart is empty!');
                return;
            }
            
            // Calculate total
            let total = 0;
            const transactionItems = [];
            
            cart.forEach(item => {
                const product = products.find(p => p.id === item.productId);
                const subtotal = product.price * item.quantity;
                total += subtotal;
                
                // Update product stock
                product.stock -= item.quantity;
                
                // Add to transaction items
                transactionItems.push({
                    productId: product.id,
                    name: product.name,
                    price: product.price,
                    quantity: item.quantity,
                    subtotal: subtotal
                });
            });
            
            // Create transaction
            const transaction = {
                id: nextTransactionId++,
                date: new Date(),
                items: transactionItems,
                total: total
            };
            
            transactions.unshift(transaction);
            
            // Clear cart
            cart = [];
            
            // Update displays
            renderCart();
            renderProducts();
            renderProductsTable();
            renderTransactionsTable();
            
            // Show receipt
            showReceipt(transaction);
        }
        
        // Product management functions
        function openProductModal(productId = null) {
            const modalTitle = document.getElementById('product-modal-title');
            const productIdField = document.getElementById('product-id');
            const productNameField = document.getElementById('product-name');
            const productCategoryField = document.getElementById('product-category');
            const productPriceField = document.getElementById('product-price');
            const productStockField = document.getElementById('product-stock');
            
            if (productId) {
                // Edit mode
                const product = products.find(p => p.id === productId);
                if (product) {
                    modalTitle.textContent = 'Edit Product';
                    productIdField.value = product.id;
                    productNameField.value = product.name;
                    productCategoryField.value = product.category;
                    productPriceField.value = product.price;
                    productStockField.value = product.stock;
                }
            } else {
                // Add mode
                modalTitle.textContent = 'Add Product';
                productIdField.value = '';
                productForm.reset();
            }
            
            productModal.style.display = 'flex';
        }
        
        function handleProductFormSubmit(e) {
            e.preventDefault();
            
            const productId = document.getElementById('product-id').value;
            const name = document.getElementById('product-name').value;
            const category = document.getElementById('product-category').value;
            const price = parseFloat(document.getElementById('product-price').value);
            const stock = parseInt(document.getElementById('product-stock').value);
            
            if (productId) {
                // Update existing product
                const index = products.findIndex(p => p.id === parseInt(productId));
                if (index !== -1) {
                    products[index] = {
                        ...products[index],
                        name,
                        category,
                        price,
                        stock
                    };
                }
            } else {
                // Add new product
                const newProduct = {
                    id: nextProductId++,
                    name,
                    category,
                    price,
                    stock
                };
                products.push(newProduct);
            }
            
            // Update displays
            renderProducts();
            renderProductsTable();
            
            // Close modal
            productModal.style.display = 'none';
        }
        
        function deleteProduct(productId) {
            if (confirm('Are you sure you want to delete this product?')) {
                products = products.filter(p => p.id !== productId);
                renderProducts();
                renderProductsTable();
            }
        }
        
        // Receipt functions
        function showReceipt(transaction) {
            const receiptContent = document.getElementById('receipt-content');
            
            let itemsHtml = '';
            transaction.items.forEach(item => {
                itemsHtml += `
                    <div class="receipt-item">
                        <div>${item.name} x${item.quantity}</div>
                        <div>$${item.subtotal.toFixed(2)}</div>
                    </div>
                `;
            });
            
            receiptContent.innerHTML = `
                <div class="receipt-header">
                    <h3>POS System</h3>
                    <p>Transaction #${transaction.id}</p>
                    <p>${new Date(transaction.date).toLocaleString()}</p>
                </div>
                <div class="receipt-items">
                    ${itemsHtml}
                </div>
                <div class="receipt-total">
                    <div>Total:</div>
                    <div>$${transaction.total.toFixed(2)}</div>
                </div>
                <div style="text-align: center; margin-top: 15px;">
                    <p>Thank you for your purchase!</p>
                </div>
            `;
            
            receiptModal.style.display = 'flex';
        }
        
        function viewReceipt(transactionId) {
            const transaction = transactions.find(t => t.id === transactionId);
            if (transaction) {
                showReceipt(transaction);
            }
        }
        
        function printReceipt() {
            const receiptContent = document.getElementById('receipt-content').innerHTML;
            const printWindow = window.open('', '_blank');
            printWindow.document.write(`
                <html>
                    <head>
                        <title>Receipt</title>
                        <style>
                            body { font-family: Arial, sans-serif; padding: 20px; }
                            .receipt-header { text-align: center; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px dashed #ddd; }
                            .receipt-item { display: flex; justify-content: space-between; margin-bottom: 5px; }
                            .receipt-total { display: flex; justify-content: space-between; font-weight: bold; padding-top: 10px; border-top: 1px dashed #ddd; }
                        </style>
                    </head>
                    <body>
                        ${receiptContent}
                    </body>
                </html>
            `);
            printWindow.document.close();
            printWindow.print();
        }
        
        // Utility functions
        function updateCurrentTime() {
            const now = new Date();
            currentTimeElement.textContent = now.toLocaleString();
            setTimeout(updateCurrentTime, 1000);
        }
        
        // Initialize the application
        init();
    </script>
</body>
</html>
