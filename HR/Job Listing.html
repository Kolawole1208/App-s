<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Job Listings Dashboard — Manage Jobs</title>

  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>

  <style>
    :root{
      --sidebar:#2c3e50; --bg:#f4f6f9; --panel:#ffffff; --muted:#64748b;
      --accent:#27ae60; --danger:#e74c3c; --action:#3498db; --warn:#f39c12;
      --radius:8px; --shadow: 0 6px 20px rgba(2,6,23,.08);
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,Segoe UI,system-ui,Arial;background:var(--bg);color:#0f172a}
    .app{display:flex;min-height:100vh}

    /* Sidebar */
    .sidebar{width:240px;background:var(--sidebar);color:#fff;padding:18px 12px;position:fixed;left:0;top:0;bottom:0}
    .sidebar h2{text-align:center;margin:6px 0 22px;font-size:18px}
    .sidebar a{display:block;color:#fff;padding:10px 12px;text-decoration:none;border-radius:6px;margin:6px 0;font-weight:600}
    .sidebar a:hover{background:rgba(255,255,255,.05)}

    /* Main */
    .main{margin-left:240px;padding:20px;width:calc(100% - 240px)}

    /* Topbar */
    .topbar{display:flex;align-items:center;justify-content:space-between;background:var(--panel);padding:12px 16px;border-radius:10px;box-shadow:var(--shadow);margin-bottom:18px;border:1px solid #eef2f6}
    .topbar .left{display:flex;gap:12px;align-items:center}
    .topbar input[type="search"]{padding:8px 12px;border:1px solid #e6eaf2;border-radius:8px;width:300px}
    .btn-add{background:var(--accent);color:#fff;border:none;padding:10px 14px;border-radius:8px;font-weight:700;cursor:pointer}
    .btn-add:hover{filter:brightness(.97)}
    .profile{display:flex;align-items:center;gap:12px;font-weight:600;color:var(--muted)}

    /* Table */
    .card{background:var(--panel);border-radius:10px;padding:12px;border:1px solid #eef2f6;box-shadow:var(--shadow)}
    table{width:100%;border-collapse:collapse;font-size:14px}
    thead th{background:#1f2a44;color:#fff;padding:12px 14px;text-align:left;font-weight:700}
    tbody td{padding:12px 14px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
    .status-active{color:green;font-weight:700}
    .status-closed{color:var(--danger);font-weight:700}
    .actions button{margin-right:6px;padding:8px 10px;border-radius:6px;border:none;color:#fff;cursor:pointer;font-weight:700}
    .actions .view{background:var(--action)}
    .actions .edit{background:var(--warn);color:#111}
    .actions .delete{background:var(--danger)}

    /* Modal base */
    .modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(2,6,23,.45);z-index:999}
    .modal.open{display:flex}
    .modal .panel{width:420px;background:#fff;border-radius:10px;padding:16px;box-shadow:0 20px 50px rgba(2,6,23,.25)}
    .modal .panel h3{margin:0 0 8px}
    .modal .form-row{margin:8px 0}
    .modal input[type="text"], .modal input[type="date"], .modal select, .modal textarea{
      width:100%;padding:10px;border-radius:8px;border:1px solid #e6eaf2;font-size:14px
    }
    .modal .row-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
    .btn{padding:8px 12px;border-radius:8px;border:none;cursor:pointer;font-weight:700}
    .btn.primary{background:var(--accent);color:#fff}
    .btn.ghost{background:#fff;border:1px solid #e6eaf2}
    .close-x{position:absolute;right:18px;top:12px;background:transparent;border:none;font-size:18px;cursor:pointer}

    /* View modal content */
    .view-list{display:flex;flex-direction:column;gap:8px}
    .view-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed #f1f5f9}
    .view-row:last-child{border-bottom:0}
    .muted{color:var(--muted);font-size:13px}

    /* small screens */
    @media (max-width:800px){
      .sidebar{display:none}
      .main{margin-left:0;width:100%;padding:12px}
      .topbar input[type="search"]{width:160px}
      .modal .panel{width:92%}
    }
  </style>
</head>
<body>

  <div class="app">
    <aside class="sidebar" aria-label="Primary">
      <h2>JobPortal</h2>
      <a href="#"><i class="fa-solid fa-chart-simple"></i> Dashboard</a>
      <a href="#" class="active"><i class="fa-solid fa-briefcase"></i> Jobs</a>
      <a href="#"><i class="fa-solid fa-user-check"></i> Applicants</a>
      <a href="#"><i class="fa-solid fa-building"></i> Employers</a>
      <a href="#"><i class="fa-solid fa-users"></i> Candidates</a>
      <a href="#"><i class="fa-solid fa-gear"></i> Settings</a>
    </aside>

    <main class="main">
      <div class="topbar" role="region" aria-label="controls">
        <div class="left">
          <input type="search" id="searchInput" placeholder="Search jobs, company, location..." />
        </div>
        <div style="display:flex;align-items:center;gap:12px">
          <button class="btn-add" id="openAddBtn"><i class="fa-solid fa-plus"></i> Add Job</button>
          <div class="profile"><i class="fa-regular fa-user"></i> Admin</div>
        </div>
      </div>

      <section class="card">
        <table aria-label="Job listings" id="jobsTable">
          <thead>
            <tr>
              <th>Job Title</th>
              <th>Company</th>
              <th>Location</th>
              <th>Posted</th>
              <th>Status</th>
              <th style="width:210px">Actions</th>
            </tr>
          </thead>
          <tbody id="job-list">
            <!-- rows inserted here -->
          </tbody>
        </table>
      </section>
    </main>
  </div>

  <!-- Add / Edit Modal -->
  <div class="modal" id="jobModal" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="panel" role="document">
      <button class="close-x" id="closeJobModal" title="Close">&times;</button>
      <h3 id="jobModalTitle">Add Job</h3>

      <div class="form-row">
        <label class="muted">Job Title</label>
        <input id="fTitle" type="text" placeholder="e.g. Senior Frontend Developer" />
      </div>
      <div class="form-row">
        <label class="muted">Company</label>
        <input id="fCompany" type="text" placeholder="Company name" />
      </div>
      <div class="form-row">
        <label class="muted">Location</label>
        <input id="fLocation" type="text" placeholder="City, Remote, etc." />
      </div>
      <div class="form-row">
        <label class="muted">Posted Date</label>
        <input id="fDate" type="date" />
      </div>
      <div class="form-row">
        <label class="muted">Status</label>
        <select id="fStatus">
          <option>Active</option>
          <option>Closed</option>
          <option>Paused</option>
        </select>
      </div>
      <div class="form-row">
        <label class="muted">Short Description</label>
        <textarea id="fDesc" rows="3" placeholder="Brief summary..."></textarea>
      </div>

      <div class="row-actions">
        <button class="btn ghost" id="cancelJobBtn">Cancel</button>
        <button class="btn primary" id="saveJobBtn">Save Job</button>
      </div>
    </div>
  </div>

  <!-- View Modal -->
  <div class="modal" id="viewModal" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="panel" role="document">
      <button class="close-x" id="closeViewModal" title="Close">&times;</button>
      <h3>Job Details</h3>
      <div class="view-list" id="viewContent">
        <!-- filled dynamically -->
      </div>
      <div style="display:flex;justify-content:flex-end;margin-top:12px;gap:8px">
        <button class="btn ghost" id="viewCloseBtn">Close</button>
      </div>
    </div>
  </div>

<script>
  // ---------- data store ----------
  const jobs = new Map();
  let jobCounter = 1; // will increment for IDs
  let isEditing = false;
  let editingId = null;

  // elements
  const jobListEl = document.getElementById('job-list');
  const jobModal = document.getElementById('jobModal');
  const viewModal = document.getElementById('viewModal');
  const openAddBtn = document.getElementById('openAddBtn');
  const closeJobModalBtn = document.getElementById('closeJobModal');
  const cancelJobBtn = document.getElementById('cancelJobBtn');
  const saveJobBtn = document.getElementById('saveJobBtn');
  const jobModalTitle = document.getElementById('jobModalTitle');

  // form fields
  const fTitle = document.getElementById('fTitle');
  const fCompany = document.getElementById('fCompany');
  const fLocation = document.getElementById('fLocation');
  const fDate = document.getElementById('fDate');
  const fStatus = document.getElementById('fStatus');
  const fDesc = document.getElementById('fDesc');

  const viewContent = document.getElementById('viewContent');

  // ---------- helper: create row element ----------
  function createRowElement(job){
    const tr = document.createElement('tr');
    tr.dataset.jobId = String(job.id);

    const tdTitle = document.createElement('td');
    tdTitle.textContent = job.title;
    tdTitle.className = 'job-title';
    tr.appendChild(tdTitle);

    const tdCompany = document.createElement('td');
    tdCompany.textContent = job.company;
    tr.appendChild(tdCompany);

    const tdLocation = document.createElement('td');
    tdLocation.textContent = job.location;
    tr.appendChild(tdLocation);

    const tdDate = document.createElement('td');
    tdDate.textContent = job.posted;
    tr.appendChild(tdDate);

    const tdStatus = document.createElement('td');
    tdStatus.textContent = job.status;
    tdStatus.className = job.status === 'Active' ? 'status-active' : (job.status === 'Closed' ? 'status-closed' : '');
    tr.appendChild(tdStatus);

    const tdActions = document.createElement('td');
    tdActions.className = 'actions';
    tdActions.style.whiteSpace = 'nowrap';

    const btnView = document.createElement('button');
    btnView.className = 'view';
    btnView.title = 'View';
    btnView.innerHTML = '<i class="fa-solid fa-eye"></i> View';
    tdActions.appendChild(btnView);

    const btnEdit = document.createElement('button');
    btnEdit.className = 'edit';
    btnEdit.title = 'Edit';
    btnEdit.innerHTML = '<i class="fa-solid fa-pen-to-square"></i> Edit';
    tdActions.appendChild(btnEdit);

    const btnDelete = document.createElement('button');
    btnDelete.className = 'delete';
    btnDelete.title = 'Delete';
    btnDelete.innerHTML = '<i class="fa-solid fa-trash"></i> Delete';
    tdActions.appendChild(btnDelete);

    tr.appendChild(tdActions);
    return tr;
  }

  // ---------- render helpers ----------
  function addJobToTable(job){
    const tr = createRowElement(job);
    jobListEl.prepend(tr); // newest at top
  }
  function updateRow(job){
    const existing = jobListEl.querySelector(`tr[data-job-id="${job.id}"]`);
    if (existing){
      const newTr = createRowElement(job);
      existing.replaceWith(newTr);
    }
  }

  // ---------- modal helpers ----------
  function openModal(modalEl){
    modalEl.classList.add('open');
    modalEl.setAttribute('aria-hidden', 'false');
    // trap focus - simple: focus first input if present
    const firstInput = modalEl.querySelector('input,select,textarea,button');
    if (firstInput) firstInput.focus();
  }
  function closeModal(modalEl){
    modalEl.classList.remove('open');
    modalEl.setAttribute('aria-hidden', 'true');
  }

  // ---------- add / edit flow ----------
  function resetForm(){
    fTitle.value = '';
    fCompany.value = '';
    fLocation.value = '';
    fDate.value = '';
    fStatus.value = 'Active';
    fDesc.value = '';
  }

  function openAddModal(){
    isEditing = false;
    editingId = null;
    jobModalTitle.textContent = 'Add Job';
    saveJobBtn.textContent = 'Save Job';
    resetForm();
    openModal(jobModal);
  }

  function openEditModal(id){
    const job = jobs.get(String(id));
    if (!job) return alert('Job not found');
    isEditing = true;
    editingId = String(id);
    jobModalTitle.textContent = 'Edit Job';
    saveJobBtn.textContent = 'Update Job';

    fTitle.value = job.title;
    fCompany.value = job.company;
    fLocation.value = job.location;
    fDate.value = job.posted;
    fStatus.value = job.status;
    fDesc.value = job.desc || '';

    openModal(jobModal);
  }

  function openViewModal(id){
    const job = jobs.get(String(id));
    if (!job) return alert('Job not found');
    viewContent.innerHTML = ''; // clear
    const rows = [
      ['Job Title', job.title],
      ['Company', job.company],
      ['Location', job.location],
      ['Posted', job.posted],
      ['Status', job.status],
      ['Description', job.desc || '—']
    ];
    rows.forEach(([k,v])=>{
      const r = document.createElement('div');
      r.className = 'view-row';
      r.innerHTML = `<div class="muted">${k}</div><div style="font-weight:700">${v}</div>`;
      viewContent.appendChild(r);
    });
    openModal(viewModal);
  }

  // ---------- save (add/update) ----------
  function saveJob(){
    const title = fTitle.value.trim();
    const company = fCompany.value.trim();
    const location = fLocation.value.trim();
    const posted = fDate.value || new Date().toISOString().slice(0,10);
    const status = fStatus.value;
    const desc = fDesc.value.trim();

    if (!title || !company || !location){
      return alert('Please fill Title, Company and Location.');
    }

    if (isEditing && editingId){
      // update existing
      const job = { id: editingId, title, company, location, posted, status, desc };
      jobs.set(String(editingId), job);
      updateRow(job);
    } else {
      // add new
      const id = String('job-' + (Date.now()) + '-' + (jobCounter++));
      const job = { id, title, company, location, posted, status, desc };
      jobs.set(id, job);
      addJobToTable(job);
    }

    closeModal(jobModal);
    resetForm();
  }

  // ---------- delete ----------
  function deleteJob(id){
    if (!confirm('Delete this job? This action cannot be undone.')) return;
    const tr = jobListEl.querySelector(`tr[data-job-id="${id}"]`);
    if (tr) tr.remove();
    jobs.delete(String(id));
  }

  // ---------- events: delegation for view/edit/delete ----------
  jobListEl.addEventListener('click', (e)=>{
    const btn = e.target.closest('button');
    if (!btn) return;
    const tr = btn.closest('tr');
    if (!tr) return;
    const id = tr.dataset.jobId;
    if (btn.classList.contains('view')) {
      openViewModal(id);
    } else if (btn.classList.contains('edit')) {
      openEditModal(id);
    } else if (btn.classList.contains('delete')) {
      deleteJob(id);
    }
  });

  // ---------- UI wiring ----------
  openAddBtn.addEventListener('click', openAddModal);
  closeJobModalBtn.addEventListener('click', ()=>closeModal(jobModal));
  cancelJobBtn.addEventListener('click', ()=>closeModal(jobModal));
  saveJobBtn.addEventListener('click', saveJob);

  document.getElementById('closeViewModal').addEventListener('click', ()=>closeModal(viewModal));
  document.getElementById('viewCloseBtn').addEventListener('click', ()=>closeModal(viewModal));

  // close modals via overlay click
  [jobModal, viewModal].forEach(mod => {
    mod.addEventListener('click', (ev)=>{
      if (ev.target === mod) closeModal(mod);
    });
  });

  // ESC to close
  document.addEventListener('keydown', (ev)=>{
    if (ev.key === 'Escape'){
      closeModal(jobModal);
      closeModal(viewModal);
    }
  });

  // simple search filter
  const searchInput = document.getElementById('searchInput');
  searchInput.addEventListener('input', ()=>{
    const q = searchInput.value.trim().toLowerCase();
    jobListEl.querySelectorAll('tr').forEach(tr=>{
      const txt = (tr.querySelector('.job-title').textContent + ' ' + tr.children[1].textContent + ' ' + tr.children[2].textContent).toLowerCase();
      tr.style.display = txt.includes(q) ? '' : 'none';
    });
  });

  // ---------- seed sample jobs ----------
  function seed(){
    const sample = [
      { title:'Frontend Developer', company:'Tech Solutions Ltd', location:'Lagos, Nigeria', posted:'2025-08-01', status:'Active', desc:'React developer with 3+ years experience' },
      { title:'Data Analyst', company:'Insight Analytics', location:'Abuja, Nigeria', posted:'2025-07-25', status:'Closed', desc:'SQL + Python' },
      { title:'Backend Engineer', company:'Global Systems', location:'Port Harcourt', posted:'2025-08-10', status:'Active', desc:'Node.js / C# experience' }
    ];
    sample.forEach(s=>{
      const id = String('job-' + (Date.now()) + '-' + (jobCounter++));
      const job = { id, ...s };
      jobs.set(id, job);
      addJobToTable(job);
    });
  }

  // run
  seed();

</script>
</body>
</html>
