<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Applicants Dashboard</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #f4f6f9;
      display: flex;
    }
    /* Sidebar */
    .sidebar {
      width: 240px;
      background: #2c3e50;
      color: white;
      height: 100vh;
      position: fixed;
      left: 0;
      top: 0;
      padding-top: 20px;
    }
    .sidebar h2 {
      text-align: center;
      margin-bottom: 30px;
    }
    .sidebar a {
      display: block;
      padding: 12px 20px;
      color: white;
      text-decoration: none;
      transition: 0.3s;
    }
    .sidebar a:hover {
      background: #34495e;
    }
    /* Main */
    .main {
      margin-left: 240px;
      padding: 20px;
      width: calc(100% - 240px);
    }
    /* Topbar */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: white;
      padding: 10px 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .topbar button {
      background: #27ae60;
      color: white;
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    /* Table */
    .applicant-table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .applicant-table th, .applicant-table td {
      padding: 14px 16px;
      text-align: left;
      border-bottom: 1px solid #eee;
    }
    .applicant-table th {
      background: #34495e;
      color: white;
    }
    .status-shortlisted { color: green; font-weight: bold; }
    .status-rejected { color: red; font-weight: bold; }
    .actions button {
      padding: 6px 10px;
      margin-right: 5px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      color: white;
    }
    .btn-view { background: #3498db; }
    .btn-edit { background: #f39c12; }
    .btn-shortlist { background: #2ecc71; }
    .btn-reject { background: #e74c3c; }
    .btn-delete { background: #7f8c8d; }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 10px;
      width: 400px;
    }
    .modal-content h3 {
      margin-top: 0;
    }
    .modal-content input, .modal-content select {
      width: 100%;
      padding: 8px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    .modal-content button {
      background: #27ae60;
      color: white;
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <h2>JobPortal</h2>
    <a href="#"><i class="fas fa-home"></i> Dashboard</a>
    <a href="#"><i class="fas fa-users"></i> Applicants</a>
    <a href="#"><i class="fas fa-briefcase"></i> Jobs</a>
    <a href="#"><i class="fas fa-file-alt"></i> Applications</a>
  </div>

  <!-- Main -->
  <div class="main">
    <div class="topbar">
      <h2>Applicants Dashboard</h2>
      <button onclick="openModal()">+ Add Applicant</button>
    </div>

    <table class="applicant-table" id="applicantTable">
      <thead>
        <tr>
          <th>Name</th>
          <th>Job Applied</th>
          <th>Email</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Alice Johnson</td>
          <td>Frontend Developer</td>
          <td>alice@example.com</td>
          <td class="status-shortlisted">Shortlisted</td>
          <td class="actions">
            <button class="btn-view" onclick="viewApplicant(this)">View</button>
            <button class="btn-edit" onclick="editApplicant(this)">Edit</button>
            <button class="btn-shortlist" onclick="shortlistApplicant(this)">Shortlist</button>
            <button class="btn-reject" onclick="rejectApplicant(this)">Reject</button>
            <button class="btn-delete" onclick="deleteApplicant(this)">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Modal -->
  <div class="modal" id="modal">
    <div class="modal-content">
      <h3 id="modalTitle">Add Applicant</h3>
      <input type="text" id="name" placeholder="Name">
      <input type="text" id="job" placeholder="Job Applied">
      <input type="email" id="email" placeholder="Email">
      <select id="status">
        <option value="Pending">Pending</option>
        <option value="Shortlisted">Shortlisted</option>
        <option value="Rejected">Rejected</option>
      </select>
      <button onclick="saveApplicant()">Save</button>
    </div>
  </div>

<script>
  let editingRow = null;

  function openModal(isEdit=false) {
    document.getElementById("modal").style.display = "flex";
    document.getElementById("modalTitle").innerText = isEdit ? "Edit Applicant" : "Add Applicant";
  }

  function closeModal() {
    document.getElementById("modal").style.display = "none";
    document.getElementById("name").value = "";
    document.getElementById("job").value = "";
    document.getElementById("email").value = "";
    document.getElementById("status").value = "Pending";
    editingRow = null;
  }

  function saveApplicant() {
    const name = document.getElementById("name").value;
    const job = document.getElementById("job").value;
    const email = document.getElementById("email").value;
    const status = document.getElementById("status").value;

    if (editingRow) {
      editingRow.cells[0].innerText = name;
      editingRow.cells[1].innerText = job;
      editingRow.cells[2].innerText = email;
      editingRow.cells[3].innerText = status;
    } else {
      const table = document.getElementById("applicantTable").getElementsByTagName("tbody")[0];
      const newRow = table.insertRow();
      newRow.innerHTML = `
        <td>${name}</td>
        <td>${job}</td>
        <td>${email}</td>
        <td>${status}</td>
        <td class="actions">
          <button class="btn-view" onclick="viewApplicant(this)">View</button>
          <button class="btn-edit" onclick="editApplicant(this)">Edit</button>
          <button class="btn-shortlist" onclick="shortlistApplicant(this)">Shortlist</button>
          <button class="btn-reject" onclick="rejectApplicant(this)">Reject</button>
          <button class="btn-delete" onclick="deleteApplicant(this)">Delete</button>
        </td>`;
    }
    closeModal();
  }

  function editApplicant(button) {
    editingRow = button.closest("tr");
    document.getElementById("name").value = editingRow.cells[0].innerText;
    document.getElementById("job").value = editingRow.cells[1].innerText;
    document.getElementById("email").value = editingRow.cells[2].innerText;
    document.getElementById("status").value = editingRow.cells[3].innerText;
    openModal(true);
  }

  function viewApplicant(button) {
    const row = button.closest("tr");
    alert(`Name: ${row.cells[0].innerText}\nJob: ${row.cells[1].innerText}\nEmail: ${row.cells[2].innerText}\nStatus: ${row.cells[3].innerText}`);
  }

  function shortlistApplicant(button) {
    button.closest("tr").cells[3].innerText = "Shortlisted";
    button.closest("tr").cells[3].className = "status-shortlisted";
  }

  function rejectApplicant(button) {
    button.closest("tr").cells[3].innerText = "Rejected";
    button.closest("tr").cells[3].className = "status-rejected";
  }

  function deleteApplicant(button) {
    button.closest("tr").remove();
  }

  // Close modal when clicking outside
  window.onclick = function(event) {
    if (event.target == document.getElementById("modal")) {
      closeModal();
    }
  }
</script>
</body>
</html>
