<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Professional Traffic Light</title>
  <style>
    :root {
      --red: #e53935;
      --yellow: #f4c542;
      --green: #43a047;

      --case: #1a1a1a;
      --shadow: rgba(0,0,0,.5);
    }

    body {
      background: linear-gradient(135deg, #3a3a3a, #1f1f1f);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial;
    }

    .traffic-light {
      width: 120px;
      padding: 18px 12px;
      border-radius: 20px;
      background: var(--case);
      box-shadow: 0 15px 25px var(--shadow), inset 0 0 10px #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .lamp {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #222;
      position: relative;
      box-shadow: inset 0 -8px 15px rgba(0,0,0,0.8);
      transition: background 0.3s ease, box-shadow 0.3s ease;
    }

    /* Glow effect with gradient */
    .lamp.on.red {
      background: radial-gradient(circle at center, var(--red) 40%, #5f0f12 100%);
      box-shadow: 0 0 25px rgba(229,57,53,0.9);
    }
    .lamp.on.yellow {
      background: radial-gradient(circle at center, var(--yellow) 40%, #5f4a12 100%);
      box-shadow: 0 0 25px rgba(244,197,66,0.9);
    }
    .lamp.on.green {
      background: radial-gradient(circle at center, var(--green) 40%, #0f3a12 100%);
      box-shadow: 0 0 25px rgba(67,160,71,0.9);
    }

    /* Controls */
    .controls {
      margin-top: 15px;
      display: flex;
      gap: 10px;
    }

    button {
      padding: 6px 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      background: linear-gradient(180deg, #4a90e2, #357ABD);
      color: #fff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: transform 0.2s, background 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      background: linear-gradient(180deg, #5aa0f2, #4688d1);
    }

    button.secondary {
      background: linear-gradient(180deg, #555, #333);
    }

    button.secondary:hover {
      background: linear-gradient(180deg, #666, #444);
    }
  </style>
</head>
<body>

  <div class="traffic-light" aria-label="Traffic light control">
    <div class="lamp red" id="red"></div>
    <div class="lamp yellow" id="yellow"></div>
    <div class="lamp green" id="green"></div>

    <div class="controls">
      <button id="startBtn">Start</button>
      <button id="stopBtn" class="secondary">Stop</button>
      <button id="resetBtn" class="secondary">Reset</button>
    </div>
  </div>

  <script>
    const red = document.getElementById('red');
    const yellow = document.getElementById('yellow');
    const green = document.getElementById('green');

    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const resetBtn = document.getElementById('resetBtn');

    let timer = null;
    let phase = 'red';

    function clearAll() {
      red.classList.remove('on','red');
      yellow.classList.remove('on','yellow');
      green.classList.remove('on','green');
    }

    function setLight(color) {
      clearAll();
      if (color === 'red') red.classList.add('on','red');
      if (color === 'yellow') yellow.classList.add('on','yellow');
      if (color === 'green') green.classList.add('on','green');
    }

    function startCycle() {
      clearInterval(timer);
      phase = 'red';
      setLight('red');

      timer = setInterval(() => {
        if (phase === 'red') {
          phase = 'green';
          setLight('green');
        } else if (phase === 'green') {
          phase = 'yellow';
          setLight('yellow');
        } else {
          phase = 'red';
          setLight('red');
        }
      }, 2000);
    }

    function stopCycle() {
      clearInterval(timer);
      timer = null;
      clearAll();
    }

    function resetCycle() {
      stopCycle();
      setLight('red');
      phase = 'red';
    }

    resetCycle();

    startBtn.addEventListener('click', () => { if (!timer) startCycle(); });
    stopBtn.addEventListener('click', stopCycle);
    resetBtn.addEventListener('click', resetCycle);
  </script>
</body>
</html>
